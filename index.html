<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strip map</title>
<link rel="icon" href="data:,">
<style>
  /* Frutiger: 300 Light, 400 Roman, 700 Bold, 900 Black (+ italics). The files lack ą ć ę ń ś ź ż, which fall back to Segoe UI. */
  @font-face { font-family: "Frutiger"; font-weight: 300; font-style: normal; font-display: swap; src: url("fonts/Frutiger_Light.ttf") format("truetype"); }
  @font-face { font-family: "Frutiger"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/Frutiger_Roman.ttf") format("truetype"); }
  @font-face { font-family: "Frutiger"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/Frutiger_Bold.ttf") format("truetype"); }
  @font-face { font-family: "Frutiger"; font-weight: 900; font-style: normal; font-display: swap; src: url("fonts/Frutiger_Black.ttf") format("truetype"); }
  @font-face { font-family: "Frutiger"; font-weight: 300; font-style: italic; font-display: swap; src: url("fonts/Frutiger_Light_Italic.ttf") format("truetype"); }
  @font-face { font-family: "Frutiger"; font-weight: 400; font-style: italic; font-display: swap; src: url("fonts/Frutiger_Roman_Italic.ttf") format("truetype"); }
  @font-face { font-family: "Frutiger"; font-weight: 700; font-style: italic; font-display: swap; src: url("fonts/Frutiger_Bold_Italic.ttf") format("truetype"); }
  @font-face { font-family: "Frutiger"; font-weight: 900; font-style: italic; font-display: swap; src: url("fonts/Frutiger_Black_Italic.ttf") format("truetype"); }
  :root { --bg: #17171a; --ink: #e8e6e1; --muted: #9a979e; --rule: #44434a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.4 "Frutiger", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 16px; }
  .controls label { font-size: 13px; color: var(--muted); }
  select, input { font: inherit; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; background: #26252b; color: var(--ink); }
  input { width: 120px; }
  .wrap { overflow-x: auto; margin: 0 16px; }
  svg#display { display: block; width: 100%; height: auto; }
  svg text { font-family: "Frutiger", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .stop, .conn { cursor: pointer; }
  .stop:focus, .stop:focus-visible { outline: none; }   /* no focus box around a clicked stop */
  .status { font-size: 13px; color: var(--muted); min-height: 1.4em; margin: 0 16px 6px; }
  .status.err { color: #e8736f; }
  .note { margin: 12px 16px 24px; font-size: 12px; color: var(--muted); }
  .note code { color: var(--ink); }
</style>
</head>
<body>
<div class="controls">
  <label>Linia <input id="q" list="lines" placeholder="np. 256" autocomplete="off"></label>
  <datalist id="lines"></datalist>
  <label>Kierunek <select id="dir"></select></label>
  <label>Typ <select id="type"><option value="">wszystkie</option></select></label>
</div>

<div class="status" id="status" role="status"></div>
<div class="wrap"><svg id="display" role="img" aria-label="Schemat linii"></svg></div>
<p class="note">Wpisz numer linii (np. <code>256</code>, <code>17</code>, <code>M2</code>) — dane pobierane są z rozkładu ZTM Warszawa.
  Kliknij przystanek, żeby ustawić go jako „następny”; kliknij numer przesiadki, żeby otworzyć tę linię.
  <span id="source"></span></p>

<script>
const SVGNS = "http://www.w3.org/2000/svg";
const PW = 1920, PH = 540;               // size of the backdrop image; everything below is drawn in these pixels

// One entry per backdrop image. A line picks one with its optional "service" field (default "zwykla").
// To add e.g. an express-line look: save img/przyspieszona.png (1920x540) and add an entry here.
const BACKDROPS = {
  zwykla: { img: "img/zwykla.png", accent: "#88007e" },
};
const DISTRICT_COLOR = "#e03a45";
const BUS_RED = "#ff0000";
const BUS_ICON = "img/bus.png";           // red round bus icon shown for bus connections
const CONN_ICON = 24;                     // diameter of the round connection icons
const CONN_FS = 20;                       // font size of the connection line numbers (regular weight)
const CONN_PER_ROW = 6;                   // line numbers per row next to an icon
const CONN_GAP = 26;                      // space between the "next stop" text and the connections
const TYPE_COLORS = { bus: "#88007e", tram: "#e8730c", metro: "#1d5fb5", train: "#2b8a57", trolleybus: "#7a5a12" };
const KIND = { bus: "bus", tram: "tram", metro: "M", train: "SKM", trolleybus: "trol" };
const TYPE_ORDER = ["metro", "train", "tram", "trolleybus", "bus"];
const $ = id => document.getElementById(id);

let LIST = [];            // [{line, type, name}] for the search box
let FULL = null;          // static fallback: whole data/lines.json (only when there is no server)
let API_OK = false;       // true when server.py answers /api/lines
let loadToken = 0, pollTimer = null;
let current = { line: null, dir: 0, stop: 0 };
let clockNode = null, connNode = null, connW = 0;
// "next stop" label: alternates Polish / English every NEXT_LABEL_MS
// `req` is inserted after the label when the selected stop is "na żądanie" (on request)
const NEXT_LABELS = [
  { text: "NASTĘPNY PRZYSTANEK", req: " (Ż)" },
  { text: "NEXT STOP", req: " (ON REQUEST)" }
];
const NEXT_LABEL_MS = 10000;
let nextLabelIdx = 0, nextOnRequest = false;
function nextLabelText() {
  const l = NEXT_LABELS[nextLabelIdx];
  return l.text + (nextOnRequest ? l.req : "") + ": ";
}
let nextNode = null, nextT1 = null, nextT2 = null, nextField = { l: 0, r: 0 }, nextClipRect = null;
let marqueeRAF = 0, marqueeGen = 0;      // scrolling of an over-long "next stop" text (see fitNext)

function el(name, attrs = {}, text) {
  const n = document.createElementNS(SVGNS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  return n;
}

function clockText() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const days = ["nd", "pn", "wt", "śr", "cz", "pt", "sb"];
  return `${p(d.getHours())}:${p(d.getMinutes())} ${days[d.getDay()]} ${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
}

// Stop flags in data/lines.json (both optional):
//   onRequest: true                 -> "na żądanie": circle without the inner dot
//   wheelchair: "none" | "partial"  -> red badge / blue+red badge next to the stop name (absent = accessible, no badge)
const WC_TITLE = {
  none: "Przystanek niedostosowany dla osób na wózkach",
  partial: "Przystanek częściowo dostosowany dla osób na wózkach"
};

// Square wheelchair badge drawn in a 24x24 box, centred on (cx, cy), scaled to `size` and tilted along the label.
function wheelchairBadge(cx, cy, size, kind) {
  // rotated -45deg like the stop names, so the badge sits level with the text
  const g = el("g", { transform: `translate(${cx},${cy}) rotate(-45) translate(${-size / 2},${-size / 2}) scale(${size / 24})` });
  if (kind === "partial") {
    // blue badge with the lower-right half red
    g.appendChild(el("rect", { width: 24, height: 24, rx: 5, fill: "#1d5fb5" }));
    const red = el("g", { "clip-path": "url(#wcBadgeClip)" });
    red.appendChild(el("path", { d: "M24,0 V24 H0 Z", fill: "#d4202c" }));
    g.appendChild(red);
  } else {
    g.appendChild(el("rect", { width: 24, height: 24, rx: 5, fill: "#d4202c" }));
  }
  g.appendChild(el("rect", { x: 0.75, y: 0.75, width: 22.5, height: 22.5, rx: 4.5, fill: "none", stroke: "#fff", "stroke-width": 1.5 }));
  // pictogram: head, back + seat + leg, arm, wheel
  const w = { fill: "none", stroke: "#fff", "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" };
  g.appendChild(el("circle", { cx: 10, cy: 5.2, r: 1.9, fill: "#fff" }));
  g.appendChild(el("path", { ...w, d: "M10 8.6 V14.2 H15.4 L17.6 19.2" }));
  g.appendChild(el("path", { ...w, d: "M10 11.2 H14.6" }));
  g.appendChild(el("path", { ...w, d: "M6.9 11.6 A5.4 5.4 0 1 0 14.4 18.6" }));
  g.appendChild(el("title", {}, WC_TITLE[kind]));
  return g;
}

// half the height of the digits at font size `fs`, so a baseline of (centre + half) centres them vertically
function digitHalfHeight(fs) {
  try {
    const c = document.createElement("canvas").getContext("2d");
    c.font = `400 ${fs}px Frutiger, "Segoe UI", Arial, sans-serif`;
    const m = c.measureText("0123456789");
    if (m.actualBoundingBoxAscent) return (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
  } catch (e) { /* fall through */ }
  return fs * 0.35;
}

// Street names are written along the slanted lines (like the real displays), centred between the two lines of their
// street. A name goes on one line if it fits the length of the lines, otherwise on two (breaking at spaces and after
// hyphens); if it is still too big for the channel the font shrinks, so it never crosses a line.
const STREET_ROT_MAX = 14, STREET_MIN_FS = 7;          // largest / smallest font size
let measureCtx = null;
function textWidth(str, fs) {                         // width of `str` in italic Frutiger at `fs` px
  if (!measureCtx) measureCtx = document.createElement("canvas").getContext("2d");
  measureCtx.font = `italic 400 100px Frutiger, "Segoe UI", Arial, sans-serif`;
  return measureCtx.measureText(str).width * fs / 100;
}
const joinTokens = a => a.reduce((acc, t, i) => acc + (i && !acc.endsWith("-") ? " " : "") + t, "");
// `text` on one line if it fits `width` at size `fs`, else the best two-line split that fits, else null
function fitLines(tokens, fs, width) {
  const one = joinTokens(tokens);
  if (textWidth(one, fs) <= width) return [one];
  let best = null;
  for (let k = 1; k < tokens.length; k++) {
    const cand = [joinTokens(tokens.slice(0, k)), joinTokens(tokens.slice(k))];
    const w = Math.max(textWidth(cand[0], fs), textWidth(cand[1], fs));
    if (w <= width && (!best || w < best.w)) best = { lines: cand, w };
  }
  return best && best.lines;
}
// span: horizontal gap between the two lines; slantLen: length of the lines
function layoutStreet(text, span, slantLen) {
  const tokens = text.trim().split(/(?<=-)|\s+/).filter(Boolean);
  const across = span * Math.SQRT1_2 - 3, along = slantLen - 10;          // free width perpendicular to the lines / free length along them
  for (let fs = STREET_ROT_MAX; fs >= STREET_MIN_FS; fs--) {
    const lines = fitLines(tokens, fs, along);
    if (lines && lines.length * fs * 1.15 <= across + 1) return { rotated: true, lines, fs };
  }
  return { rotated: true, lines: [joinTokens(tokens)], fs: STREET_MIN_FS };    // last resort: may be tight
}

// Round red tram icon (same look as img/bus.png), centred on (cx, cy), diameter d
function tramIcon(cx, cy, d) {
  const g = el("g", { transform: `translate(${cx - d / 2},${cy - d / 2}) scale(${d / 50})` });
  const W = { stroke: "#fff", "stroke-width": 2, "stroke-linecap": "round", fill: "none" };
  g.appendChild(el("circle", { cx: 25, cy: 25, r: 25, fill: BUS_RED }));
  g.appendChild(el("path", { ...W, d: "M20,8.5 H30 M25,8.5 V13" }));
  g.appendChild(el("rect", { x: 15, y: 13, width: 20, height: 24, rx: 5, fill: "#fff" }));
  g.appendChild(el("rect", { x: 18, y: 16, width: 14, height: 9, rx: 1.5, fill: BUS_RED }));
  g.appendChild(el("circle", { cx: 20.5, cy: 31, r: 1.8, fill: BUS_RED }));
  g.appendChild(el("circle", { cx: 29.5, cy: 31, r: 1.8, fill: BUS_RED }));
  g.appendChild(el("path", { ...W, d: "M19,37 L16,43 M31,37 L34,43" }));
  return g;
}

function render() {
  const line = current.line;
  if (!line) return;
  const dir = line.directions[current.dir] || line.directions[0];
  const stops = dir.stops;
  const n = stops.length;
  const bd = BACKDROPS[line.service] || BACKDROPS.zwykla;
  const accent = bd.accent;
  const cur = Math.min(current.stop, n - 1);

  const svg = $("display");
  svg.replaceChildren();
  svg.setAttribute("viewBox", `0 0 ${PW} ${PH}`);
  svg.style.minWidth = "760px";
  svg.appendChild(el("image", { href: bd.img, x: 0, y: 0, width: PW, height: PH }));
  const defs = el("defs");
  const clip = el("clipPath", { id: "wcBadgeClip" });
  clip.appendChild(el("rect", { width: 24, height: 24, rx: 5 }));
  defs.appendChild(clip);
  const nclip = el("clipPath", { id: "nextClip" });
  nextClipRect = nclip.appendChild(el("rect", { x: 0, y: 0, width: PW, height: 76 }));
  defs.appendChild(nclip);
  svg.appendChild(defs);

  // ---- line number inside the (empty) number box of the backdrop ----
  svg.appendChild(el("text", { x: 253.5, y: 101, "font-size": line.line.length > 3 ? 62 : 86, "font-weight": 700, fill: "#1a1a1a", "text-anchor": "middle" }, line.line));

  // ---- clock inside the blue box of the backdrop ----
  clockNode = el("text", { x: 26, y: 522, "font-size": 20, "font-weight": 700, fill: "#fff" }, clockText());
  svg.appendChild(clockNode);
  fitClock();

  // ---- header: connections of the selected stop; the "next stop" text and the connections are centred together (see fitNext) ----
  const conns = stops[cur].connections;
  const groups = TYPE_ORDER.map(t => ({ type: t, items: conns.filter(c => c.type === t) })).filter(g => g.items.length);
  const numHalf = digitHalfHeight(CONN_FS);
  const CY = 45;                                              // vertical centre of the connections, level with the "next stop" text
  connNode = svg.appendChild(el("g"));
  connW = 0;
  if (groups.length) {
    const red = accent, D = CONN_ICON;      // ring + arrow in the line's purple
    // "next stop" symbol: ring with a dot, arrow pointing right
    connNode.appendChild(el("circle", { cx: 12, cy: CY, r: 9, fill: "none", stroke: red, "stroke-width": 3 }));
    connNode.appendChild(el("circle", { cx: 12, cy: CY, r: 5, fill: accent }));   // bigger dot, in the line's purple
    connNode.appendChild(el("path", { d: `M23,${CY} H45 M37,${CY - 8} L45,${CY} L37,${CY + 8}`, fill: "none", stroke: red, "stroke-width": 3 }));
    let bx = 49 + 16;
    groups.forEach((g, gi) => {
      const shown = g.items.slice(0, CONN_PER_ROW * 2), rows = Math.ceil(shown.length / CONN_PER_ROW);
      // icon / tag, centred on the rows of numbers
      let iw;
      if (g.type === "bus") {
        connNode.appendChild(el("image", { href: BUS_ICON, x: bx, y: CY - D / 2, width: D, height: D }));
        iw = D;
      } else if (g.type === "tram") {
        connNode.appendChild(tramIcon(bx + D / 2, CY, D));
        iw = D;
      } else {
        iw = KIND[g.type].length * 11 + 16;
        connNode.appendChild(el("rect", { x: bx, y: CY - 12, width: iw, height: 24, rx: 3, fill: TYPE_COLORS[g.type] }));
        connNode.appendChild(el("text", { x: bx + iw / 2, y: CY + 5.5, "font-size": 16, "font-weight": 700, fill: "#fff", "text-anchor": "middle" }, KIND[g.type]));
      }
      // line numbers, vertically centred with the icon (rows of CONN_PER_ROW)
      let maxEnd = bx + iw;
      for (let r = 0; r < rows; r++) {
        let tx = bx + iw + 9;
        const rowY = CY + (r - (rows - 1) / 2) * 27;
        shown.slice(r * CONN_PER_ROW, (r + 1) * CONN_PER_ROW).forEach(c => {
          const cg = el("g", { class: "conn" });
          const t = el("text", { x: tx, y: rowY + numHalf, "font-size": CONN_FS, "font-weight": 400, fill: "#444" }, c.line);
          cg.appendChild(t);
          cg.appendChild(el("title", {}, `${c.line} (${c.type})`));
          connNode.appendChild(cg);
          const w = t.getComputedTextLength();
          cg.insertBefore(el("rect", { x: tx - 4, y: rowY - 13, width: w + 8, height: 26, fill: "transparent" }), t);
          cg.addEventListener("click", () => openLine(c.line));
          tx += w + 14;
        });
        maxEnd = Math.max(maxEnd, tx - 14);
      }
      bx = maxEnd + 24;
    });
    connW = bx - 24;
  }

  // ---- header: next stop, centred above the backdrop's rule (x 364..1909, y 77) together with the connections ----
  const fieldL = 372, fieldR = 1902;
  const nextG = svg.appendChild(el("g", { "clip-path": "url(#nextClip)" }));
  nextNode = el("text", { x: fieldL, y: 64, fill: "#1a1a1a" });
  nextOnRequest = !!stops[cur].onRequest;
  nextT1 = el("tspan", { "font-size": 42, "font-weight": 300 }, nextLabelText());
  nextT2 = el("tspan", { "font-size": 54, "font-weight": 700, fill: accent }, stops[cur].name.toUpperCase());
  nextNode.append(nextT1, nextT2);
  nextG.appendChild(nextNode);
  nextField = { l: fieldL, r: fieldR };                       // the text must leave room for the connections (fitNext)
  fitNext();

  // ---- strip geometry ----
  const LX = 400;
  const longest = Math.max(...stops.map(s => s.name.length));
  const lastLen = stops[n - 1].name.length;
  const y = 340, bandH = 42, barY = y + bandH + 6, barH = 25;
  // font size: limited by spacing, and by the room between the header rule and the band
  const BADGE = 22, BADGE_GAP = 5;                                        // wheelchair badge size / gap after the label
  const hasBadge = s => s.wheelchair === "none" || s.wheelchair === "partial";
  const roomUp = y - 100;
  const approxStep = (1740 - LX) / Math.max(n - 1, 1);
  // each label may only grow until its top end (plus its badge, if any) reaches the header rule
  const fitFs = Math.min(...stops.map(s => (roomUp - (hasBadge(s) ? BADGE + BADGE_GAP : 0)) / (s.name.length * 0.68 * 0.7071 + 0.6)));
  const fs = Math.max(11, Math.min(24, approxStep * 0.75, fitFs));
  const lastDx = lastLen * fs * 0.68 * 0.7071 + 14;
  const LX_END = Math.min(1740, PW - 14 - lastDx);                      // keep the last label inside the panel
  const step = Math.max(20, Math.min(94, (LX_END - LX) / Math.max(n - 1, 1)));
  const lastX = LX + step * (n - 1);
  const rise = Math.ceil(longest * fs * 0.68 * 0.7071) + 14;

  // thin purple bar with the stop circles on it; the minutes sit in their own row below it
  const lineH = 8, cy = y + 9;
  svg.appendChild(el("rect", { x: LX, y: cy - lineH / 2, width: lastX - LX, height: lineH, fill: accent }));   // ends at the first/last circle centres, so nothing sticks out
  const r = Math.min(8, step * 0.3), mfs = Math.min(14, step * 0.5);
  stops.forEach((s, i) => {
    const x = LX + i * step;
    const passed = i < cur, isCur = i === cur, isLast = i === n - 1;
    const g = el("g", { class: "stop", tabindex: 0 });
    g.appendChild(el("rect", { x: x - step / 2, y: y - rise, width: step, height: rise + bandH, fill: "transparent" }));
    g.appendChild(el("circle", { cx: x, cy, r, fill: passed ? "#d9a8d6" : "#fff", stroke: accent, "stroke-width": 2.5 }));
    if (!s.onRequest) g.appendChild(el("circle", { cx: x, cy, r: r * 0.42, fill: accent }));   // on-request stops: empty circle
    if (s.onRequest) g.appendChild(el("title", {}, `${s.name} (na żądanie)`));
    if (s.minutes != null) g.appendChild(el("text", { x, y: y + bandH - 7, "font-size": mfs, "text-anchor": "middle", fill: "#555" }, s.minutes + "’"));
    const label = el("text", {
      transform: `translate(${x + 2},${y - 10}) rotate(-45)`, "font-size": fs,
      "font-weight": isCur || isLast ? 700 : 400,
      fill: isCur ? accent : passed ? "#8f8f8f" : "#1a1a1a"
    }, s.name.toUpperCase());
    g.appendChild(label);
    svg.appendChild(g);
    if (hasBadge(s)) {
      // badge continues the label's direction, just past its upper end, centred on the text height
      const L = label.getComputedTextLength(), k = 0.7071;
      const d = L + BADGE_GAP + BADGE / 2, up = fs * 0.33;
      g.appendChild(wheelchairBadge(x + 2 + k * d - k * up, y - 10 - k * d - k * up, BADGE, s.wheelchair));
    }
    g.addEventListener("click", () => { current.stop = i; render(); });
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { current.stop = i; render(); } });
  });

  // ---- streets: where the street changes, a thin line leaves the purple line, runs straight down behind the district bar and
  //      continues below it tilted like the stop names (45 deg); each street name runs between its two lines ----
  // A stop's own landmark ("poi") wins over its street. Stops without a street carry the previous one on, and
  // loops ("Pętla ...") are never printed (they are not shown on the real displays).
  const isLoop = name => /(^|[^\p{L}])p[eę]t[lł]a([^\p{L}]|$)/iu.test(name);
  const keys = [];
  let prevStreet = "";
  stops.forEach(s => {
    if (s.poi) { keys.push("p:" + s.poi); return; }
    const st = (s.street || "").trim();
    if (st && !isLoop(st)) prevStreet = "s:" + st;
    keys.push(prevStreet);
  });
  const SLANT_DEG = 45;                                              // same tilt as the stop names
  const y0 = barY + barH;                                            // bottom edge of the district bar: the tilted part starts here
  const SLANT_DY = Math.min(112, PH - 8 - y0), SLANT_DX = -SLANT_DY / Math.tan(SLANT_DEG * Math.PI / 180);
  const SLANT_LEN = Math.hypot(SLANT_DX, SLANT_DY);
  const groups_ = [];                                                // [{xL, xR, text}] one per run of stops on the same street
  for (let i = 0; i < n;) {
    let j = i;
    while (j + 1 < n && keys[j + 1] === keys[i]) j++;
    if (keys[i]) groups_.push({
      xL: i === 0 ? LX - 12 : LX + (i - 0.5) * step,                // street borders sit between two stops (bar ends at the strip's ends)
      xR: j === n - 1 ? lastX + 12 : LX + (j + 0.5) * step,
      text: keys[i].slice(2)
    });
    i = j + 1;
  }
  const drawnLines = new Set();
  groups_.forEach(({ xL, xR }) => [xL, xR].forEach(x => {
    if (drawnLines.has(Math.round(x))) return;
    drawnLines.add(Math.round(x));
    // drawn BEFORE the district bar, so the vertical part is hidden under it
    svg.appendChild(el("polyline", { points: `${x},${cy + lineH / 2} ${x},${y0} ${x + SLANT_DX},${y0 + SLANT_DY}`, fill: "none", stroke: "#555", "stroke-width": 1 }));
  }));

  // ---- district bar: consecutive stops in one district share a segment ----
  if (stops.some(s => s.district)) {
    const half = step / 2;
    let i = 0;
    while (i < n) {
      let j = i;
      while (j + 1 < n && stops[j + 1].district === stops[i].district) j++;
      const x1 = LX + i * step - (i === 0 ? 12 : half - 1.5), x2 = LX + j * step + (j === n - 1 ? 12 : half - 1.5);
      svg.appendChild(el("rect", { x: x1, y: barY, width: x2 - x1, height: barH, fill: DISTRICT_COLOR }));
      if (stops[i].district) {
        const label = el("text", { x: (x1 + x2) / 2, y: barY + 18, "font-size": 16, "font-weight": 700, "text-anchor": "middle", fill: "#fff" }, stops[i].district);
        svg.appendChild(label);
        const lw = label.getComputedTextLength();
        if (lw > x2 - x1 - 8) label.setAttribute("font-size", 16 * (x2 - x1 - 8) / lw);
      }
      i = j + 1;
    }
  }

  // street names: along the tilted lines, centred between the two lines of their street (over the bar's bottom edge, never under it)
  groups_.forEach(({ xL, xR, text }) => {
    const xm = (xL + xR) / 2;
    const L = layoutStreet(text, xR - xL, SLANT_LEN);
    const lh = L.fs * 1.15, attrs = { "font-size": L.fs, "font-style": "italic", "text-anchor": "middle", fill: "#333" };
    const g = el("g", { transform: `translate(${xm + SLANT_DX / 2},${y0 + SLANT_DY / 2}) rotate(${-SLANT_DEG})` });
    L.lines.forEach((ln, k) => g.appendChild(el("text", { ...attrs, x: 0, y: (k - (L.lines.length - 1) / 2) * lh + L.fs * 0.35 }, ln)));
    svg.appendChild(g);
  });
}

// The "next stop" text keeps its size. If it is wider than the space left beside the connections it is shown in a
// window and scrolls to its end and back (pausing at both ends); otherwise text + connections are centred together.
function setNextClip(x, w) {
  if (nextClipRect) { nextClipRect.setAttribute("x", x); nextClipRect.setAttribute("width", Math.max(0, w)); }
}

function stopMarquee() {
  cancelAnimationFrame(marqueeRAF);
  marqueeGen++;
}

function startMarquee(dist) {
  stopMarquee();
  const gen = marqueeGen, SPEED = 90, PAUSE = 1600;          // SPEED in panel pixels per second
  const move = dist / SPEED * 1000, total = 2 * (PAUSE + move);
  let t0 = null;
  const frame = ts => {
    if (gen !== marqueeGen || !nextNode) return;
    if (t0 === null) t0 = ts;
    const t = (ts - t0) % total;
    let off;
    if (t < PAUSE) off = 0;
    else if (t < PAUSE + move) off = (t - PAUSE) / move * dist;
    else if (t < 2 * PAUSE + move) off = dist;
    else off = dist - (t - 2 * PAUSE - move) / move * dist;
    nextNode.setAttribute("transform", `translate(${-off},0)`);
    marqueeRAF = requestAnimationFrame(frame);
  };
  marqueeRAF = requestAnimationFrame(frame);
}

function fitNext() {
  if (!nextNode) return;
  stopMarquee();
  nextNode.removeAttribute("transform");
  nextT1.setAttribute("font-size", 42); nextT2.setAttribute("font-size", 54);
  const extra = connW ? CONN_GAP + connW : 0;
  const full = nextField.r - nextField.l;
  const avail = full - extra;
  const tw = nextNode.getComputedTextLength();
  if (tw > avail) {
    nextNode.setAttribute("x", nextField.l);
    setNextClip(nextField.l, avail);
    if (connNode) connNode.setAttribute("transform", `translate(${nextField.l + avail + CONN_GAP},0)`);
    startMarquee(tw - avail);
  } else {
    const start = nextField.l + (full - tw - extra) / 2;
    nextNode.setAttribute("x", start);
    setNextClip(nextField.l - 20, full + 40);
    if (connNode) connNode.setAttribute("transform", `translate(${start + tw + CONN_GAP},0)`);
  }
}

function toggleNextLabel() {
  nextLabelIdx = (nextLabelIdx + 1) % NEXT_LABELS.length;
  if (!nextT1) return;
  nextT1.textContent = nextLabelText();
  fitNext();
}

function fitClock() {
  if (!clockNode) return;
  clockNode.setAttribute("font-size", 20);
  const w = clockNode.getComputedTextLength();
  if (w > 196) clockNode.setAttribute("font-size", 20 * 196 / w);
}

function fillDirections() {
  const sel = $("dir");
  sel.replaceChildren();
  current.line.directions.forEach((d, i) => sel.add(new Option(d.name, i)));
  sel.value = current.dir;
}

function setStatus(text, isError = false) {
  const n = $("status");
  n.textContent = text;
  n.classList.toggle("err", isError);
}

// One line, from the server (live lookup) or, without a server, from the static data/lines.json.
async function fetchLine(id) {
  if (API_OK) {
    const r = await fetch(`api/line/${encodeURIComponent(id)}`);
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }
  return FULL.lines.find(l => l.line.toLowerCase() === String(id).trim().toLowerCase()) || null;
}

async function openLine(id, dir = 0) {
  id = String(id).trim();
  if (!id) return false;
  const token = ++loadToken;
  clearTimeout(pollTimer);
  setStatus(`Wczytywanie linii ${id}…`);
  let line;
  try { line = await fetchLine(id); }
  catch (e) { if (token === loadToken) setStatus("Nie udało się pobrać danych linii.", true); return false; }
  if (token !== loadToken) return false;                                   // a newer request took over
  if (!line) { setStatus(`Nie znaleziono linii „${id}”.`, true); return false; }
  current = { line, dir: Math.min(dir, line.directions.length - 1), stop: 0 };
  $("q").value = line.line;
  fillDirections();
  render();
  history.replaceState(null, "", `#${encodeURIComponent(line.line)}/${current.dir}`);
  pollEnrich(line, token);
  return true;
}

// Streets and districts arrive gradually (the server looks them up one by one): refresh until complete.
function pollEnrich(line, token) {
  if (!line.enriching) {
    setStatus(line.geocoder === "error" ? "Ulice i dzielnice chwilowo niedostępne (brak połączenia z geokoderem)." : "", line.geocoder === "error");
    return;
  }
  setStatus(`Uzupełnianie ulic i dzielnic… (jeszcze ${line.enriching} przystanków)`);
  pollTimer = setTimeout(async () => {
    try {
      const fresh = await fetchLine(line.line);
      if (token !== loadToken || !fresh) return;
      current.line = fresh;                                                // keeps the selected direction and stop
      render();
      pollEnrich(fresh, token);
    } catch (e) { if (token === loadToken) setStatus(""); }
  }, 3000);
}

function fillLineList() {
  const t = $("type").value;
  const dl = $("lines");
  dl.replaceChildren();
  LIST.filter(l => !t || l.type === t).forEach(l => dl.appendChild(new Option(`${l.line} — ${l.name}`, l.line)));
}

// Left / Right arrow keys move the selected ("next") stop; ignored while typing in the controls
document.addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || !current.line) return;
  const n = (current.line.directions[current.dir] || current.line.directions[0]).stops.length;
  const cur = Math.min(current.stop, n - 1);
  const next = Math.max(0, Math.min(n - 1, cur + (e.key === "ArrowRight" ? 1 : -1)));
  e.preventDefault();                                                       // don't scroll the strip sideways
  if (next !== cur) { current.stop = next; render(); }
});

async function init() {
  setInterval(toggleNextLabel, NEXT_LABEL_MS);
  setInterval(() => { if (clockNode) { clockNode.textContent = clockText(); fitClock(); } }, 15000);

  // 1) live lookup through server.py  2) fallback: the static demo file data/lines.json
  try {
    const r = await fetch("api/lines");
    if (!r.ok) throw new Error();
    LIST = (await r.json()).lines;
    API_OK = true;
    $("source").textContent = "Dane: ZTM Warszawa (rozkłady GTFS), ulice i dzielnice: © współtwórcy OpenStreetMap.";
  } catch (e) {
    try {
      FULL = await (await fetch("data/lines.json")).json();
      LIST = FULL.lines.map(l => ({ line: l.line, type: l.type, name: l.directions[0].name }));
      $("source").textContent = "Tryb offline: dane demonstracyjne z data/lines.json. Uruchom server.py, żeby wyszukiwać prawdziwe linie.";
    } catch (e2) {
      $("display").outerHTML = "<p class='note'>Nie udało się wczytać danych (uruchom <code>python3 server.py</code>).</p>";
      return;
    }
  }
  try {
    await Promise.all(["300", "400", "700", "900", "italic 400"].map(w => document.fonts.load(`${w} 20px Frutiger`)));
  } catch (e) { /* fall back to system fonts */ }
  [...new Set(LIST.map(l => l.type))].forEach(t => $("type").add(new Option(t, t)));
  fillLineList();

  // type a line: open it on Enter / picking from the list, or automatically once the text is an exact line number
  const submit = async () => { if (await openLine($("q").value)) $("q").blur(); else $("q").select(); };
  $("q").addEventListener("change", submit);
  let typing = null;
  $("q").addEventListener("input", () => {
    clearTimeout(typing);
    const v = $("q").value.trim().toLowerCase();
    if (v && LIST.some(l => l.line.toLowerCase() === v) && (!current.line || current.line.line.toLowerCase() !== v))
      typing = setTimeout(() => openLine($("q").value), 450);
  });
  $("dir").addEventListener("change", () => { openLine(current.line.line, +$("dir").value); $("dir").blur(); });
  $("type").addEventListener("change", fillLineList);

  const [h, d] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (!(h && await openLine(h, +d || 0))) await openLine(LIST.find(l => l.line === "256") ? "256" : LIST[0].line);
}
init();
</script>
</body>
</html>
